<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencia de Viajes - Listado de Viajes</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Iconos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link href="./css/styles.css" rel="stylesheet">
</head>
<body>
    <!-- Sidebar / Menú Lateral -->
    <div id="sidebar" class="d-flex flex-column">
        <button id="toggle-btn" class="btn mb-3 mt-3 mx-auto">
            <i id="toggle-icon" class="bi bi-menu-app"></i>
        </button>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="index.html">
                    <i class="bi bi-house-door"></i> <span>Inicio</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="excursiones.html">
                    <i class="bi bi-compass"></i> <span>Catálogo Excursiones</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="listado-viajes.html">
                    <i class="bi bi-map"></i> <span>Listado de Viajes</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="alta-viaje.html">
                    <i class="bi bi-plus-square"></i> <span>Nuevo Viaje</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Content / Contenido Principal -->
    <div id="content">
        <div class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Listado de Viajes Registrados</h2>
                <a href="alta-viaje.html" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nuevo Viaje
                </a>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-primary">
                        <tr>
                            <th># ID</th>
                            <th>Destino</th>
                            <th>Fecha Inicio</th>
                            <th>Fecha Fin</th>
                            <th>Precio Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="viajes-body">
                        <!-- Las filas se cargarán dinámicamente mediante JavaScript y fetch() -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script del Sidebar -->
    <script>
        document.getElementById('toggle-btn').addEventListener('click', function () {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        });
    </script>

    <!-- Script de lógica y fetch con la API -->
    <script src="./js/viajes.js"></script>
</body>
</html>>
